server {
    listen 80;
    server_name belowmarketuae.com www.belowmarketuae.com;
    return 301 https://belowmarketuae.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.belowmarketuae.com;

    ssl_certificate /etc/letsencrypt/live/belowmarketuae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belowmarketuae.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://belowmarketuae.com$request_uri;
}

server {
    listen 443 ssl;
    server_name belowmarketuae.com;

    ssl_certificate /etc/letsencrypt/live/belowmarketuae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belowmarketuae.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location /threads-radar/ {
        auth_basic "Threads Trend Radar";
        auth_basic_user_file /etc/nginx/.threads-radar.htpasswd;
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

